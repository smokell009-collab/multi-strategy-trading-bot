[workspace]
members = [
    ".",
    "crates/ode-domain",
    "crates/ode-events",
    "crates/ode-risk",
    "crates/ode-execution",
    "crates/ode-binance-testnet",
    "crates/ode-market-data",
    "crates/ode-strategy-technical",
    "crates/ode-backtest",
    "crates/ode-model-adapter",
    "crates/ode-observability",
    "crates/ode-polymarket",
]
resolver = "3"

[package]
name = "olho-de-deus"
version = "0.2.0"
edition = "2024"
description = "Bot paper com estratégias, monitor Polymarket read-only e adapter Binance Spot Testnet explícito"
license = "MIT"

[[bin]]
name = "olho-de-deus"
path = "src/main.rs"

[[bin]]
name = "polymarket-watch"
path = "src/bin/polymarket_watch.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

ode-domain = { path = "crates/ode-domain" }
ode-execution = { path = "crates/ode-execution" }
ode-binance-testnet = { path = "crates/ode-binance-testnet" }
ode-events = { path = "crates/ode-events" }
ode-risk = { path = "crates/ode-risk" }
ode-market-data = { path = "crates/ode-market-data" }
ode-strategy-technical = { path = "crates/ode-strategy-technical" }
ode-backtest = { path = "crates/ode-backtest" }
ode-model-adapter = { path = "crates/ode-model-adapter" }
ode-observability = { path = "crates/ode-observability" }
ode-polymarket = { path = "crates/ode-polymarket" }

[profile.release]
strip = true
lto = true
codegen-units = 1
