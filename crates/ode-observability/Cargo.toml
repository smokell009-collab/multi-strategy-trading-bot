[package]
name = "ode-observability"
version = "0.4.0"
edition = "2024"
description = "Auditoria SQLite consultável, alertas e dashboard local autenticado"
license = "MIT"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
ode-domain = { package = "ode-domain", path = "../ode-domain" }
ode-events = { package = "ode-events", path = "../ode-events" }
ode-model-adapter = { package = "ode-model-adapter", path = "../ode-model-adapter" }
rusqlite = { version = "0.37", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
