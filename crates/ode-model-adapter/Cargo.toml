[package]
name = "ode-model-adapter"
version = "0.4.0"
edition = "2024"
description = "Adaptador opt-in de aconselhamento read-only para snapshots públicos de mercado"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
