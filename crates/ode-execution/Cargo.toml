[package]
name = "ode-execution"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
ode-domain = { path = "../ode-domain" }
rusqlite = { version = "0.37", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
