[package]
name = "ode-risk"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
ode-domain = { path = "../ode-domain" }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
